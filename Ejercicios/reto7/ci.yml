name: C CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install GCC
      run: sudo apt-get update && sudo apt-get install -y gcc make

    - name: Build project
      run: make build

    - name: Run tests
      run: |
        echo "🚀 Ejecutando tests..."
        make test || echo "❌ Algunos tests fallaron"
